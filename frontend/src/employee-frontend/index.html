<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <title>Varhaiskasvatus</title>
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <noscript>
      <main style="margin: 0 20px">
        <p>Sivusto vaatii, että JavaScript on sallittu selaimessasi.</p>
        <p>Sidan kräver att JavaScript är aktiverat i din webbläsare.</p>
        <p>This site requires JavaScript to be enabled in your browser.</p>
      </main>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/employee-frontend/index.tsx"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var app = document.getElementById('app')
        if (!window.evaka && app) {
          var html = ''
          html += '<main style="margin: 0 20px">'
          html += '<p>'
          html +=
            'Sivua ei voida avata. Kokeile <a href="/employee/">avata sivu uudelleen</a> tai päivittää selain.'
          html += '</p>'
          html += '<p>'
          html +=
            'Sidan kunde inte laddas. Var god och försök att <a href="/employee/">öppna sidan igen</a>, eller uppdatera din webbläsare.'
          html += '</p>'
          html += '<p>'
          html +=
            'The site could not be loaded. Please try to <a href="/employee/">open the site again</a> or update the browser.'
          html += '</p>'
          html += '</main>'
          app.innerHTML = html
        }
      })
    </script>
  </body>
</html>
