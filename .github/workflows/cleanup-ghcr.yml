name: Cleanup GHCR

on:
  schedule:
    # Mondays 01:17 UTC ~= 03:17 (winter) / 04:17 (summer) Helsinki time.
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - evaka/frontend
          - evaka/frontend-multi
          - evaka/frontend-builder
          - evaka/service
          - evaka/service-builder
          - evaka/api-gateway
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE: ${{ matrix.package }}
    steps:
      # We delete via the REST API instead of actions/delete-package-versions
      # because that action aborts on the first 404 ("delete version API failed.
      # Package not found."). GHCR returns 404s routinely here: deleting one
      # untagged manifest prunes sibling manifests that were already listed, so
      # a later delete of a now-gone version 404s. We tolerate 404 and only fail
      # on a genuinely unexpected error.
      - name: Delete untagged versions of ${{ matrix.package }}
        run: |
          set -euo pipefail
          base="/orgs/espoon-voltti/packages/container/${PACKAGE//\//%2F}/versions"
          # Capture the listing separately so a failed API call aborts the job
          # (a process substitution would swallow the error and pass green).
          if ! raw=$(gh api --paginate "${base}?per_page=100&state=active" \
            -q '.[] | select((.metadata.container.tags // []) | length == 0) | .id'); then
            echo "::error::failed to list versions for ${PACKAGE}"; exit 1
          fi
          mapfile -t ids < <(printf '%s\n' "$raw" | grep -E '^[0-9]+$' || true)
          echo "untagged versions to delete: ${#ids[@]}"
          deleted=0
          for id in "${ids[@]}"; do
            if out=$(gh api -X DELETE "${base}/${id}" 2>&1); then
              deleted=$((deleted + 1))
            elif printf '%s' "$out" | grep -q "HTTP 404"; then
              : # already pruned along with a sibling manifest — expected
            else
              echo "::error::delete failed for version $id: $out"; exit 1
            fi
          done
          echo "deleted $deleted untagged version(s)"

      - name: Keep newest 100 versions of ${{ matrix.package }}
        if: matrix.package == 'evaka/frontend' # Extend this in future if needed.
        run: |
          set -euo pipefail
          base="/orgs/espoon-voltti/packages/container/${PACKAGE//\//%2F}/versions"
          # Sort all versions oldest-first across every page, then drop the
          # newest 100 from the tail; the remainder is what we delete. The
          # `max 0` guards the case of <100 versions, where `length - 100` is
          # negative and jq's slice would otherwise keep only a few newest.
          if ! raw=$(gh api --paginate --slurp "${base}?per_page=100&state=active" \
            | jq -r '[.[][]] | sort_by(.created_at) | .[0:([length - 100, 0] | max)] | .[].id'); then
            echo "::error::failed to list versions for ${PACKAGE}"; exit 1
          fi
          mapfile -t ids < <(printf '%s\n' "$raw" | grep -E '^[0-9]+$' || true)
          echo "versions to delete beyond the newest 100: ${#ids[@]}"
          deleted=0
          for id in "${ids[@]}"; do
            if out=$(gh api -X DELETE "${base}/${id}" 2>&1); then
              deleted=$((deleted + 1))
            elif printf '%s' "$out" | grep -q "HTTP 404"; then
              :
            else
              echo "::error::delete failed for version $id: $out"; exit 1
            fi
          done
          echo "deleted $deleted old version(s)"
