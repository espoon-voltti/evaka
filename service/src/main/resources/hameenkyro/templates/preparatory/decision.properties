decision.instructions=<p>Sovelletut oikeusohjeet:<br/>Perusopetuslaki 4, 5, 6 ja 18 §</p><p>Päätöksessä ilmoitetun paikan vastaanottamis- tai kieltäytymisilmoitus on toimitettava <strong>välittömästi, viimeistään kahden viikon kuluessa</strong> tämän ilmoituksen saamisesta. Paikan voi käydä hyväksymässä/hylkäämässä sähköisesti osoitteessa <a href="https://evaka.hameenkyro.fi" rel="noreferrer">evaka.hameenkyro.fi</a> (vaatii tunnistautumisen) tai postitse.</p><p>Tämä päätös poistaa lapsen perusopetukseen valmistavan opetuksen hakemuksen.</p><p>Toimivalta: Hämeenkyrön kunnan hallintosääntö 108 §.</p>

